<div data-live-meta="{{ t('profiles_page', total=total, page=page + 1, pages=pages) }}"></div>
<table>
  <thead>
    <tr>
      <th>{{ t('customer_id_name') }}</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for it in items %}
    <tr>
      <td class="mono">
        <button type="button" class="copy-cell" data-copy="{{ it.telegram_id }}" title="{{ t('copy_id') }}">{{ it.label }}</button>
        <a class="btn ghost small" href="/customers/{{ it.telegram_id }}">↗</a>
      </td>
      <td class="row-actions">
        <form method="post" action="/rates/toggle" style="display:inline">
          <input type="hidden" name="tier" value="{{ tier }}" />
          <input type="hidden" name="tg_id" value="{{ it.telegram_id }}" />
          <input type="hidden" name="q" value="{{ q }}" />
          <input type="hidden" name="page" value="{{ page }}" />
          <input type="hidden" name="members" value="{{ 1 if members_only else 0 }}" />
          <button class="btn {% if it.in_list %}danger{% else %}{% endif %} small" type="submit">
            {% if it.in_list %}{{ t('rates_remove') }}{% else %}{{ t('rates_add') }}{% endif %}
          </button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="muted">{{ t('rates_empty') }}</td></tr>
    {% endfor %}
  </tbody>
</table>
<div class="pager">
  {% if page > 0 %}<a class="btn ghost small" href="/rates?tier={{ tier }}&q={{ q }}&members={{ 1 if members_only else 0 }}&page={{ page - 1 }}">{{ t('prev') }}</a>{% endif %}
  <span class="muted">{{ t('page_of', page=page + 1, pages=pages) }}</span>
  {% if page + 1 < pages %}<a class="btn ghost small" href="/rates?tier={{ tier }}&q={{ q }}&members={{ 1 if members_only else 0 }}&page={{ page + 1 }}">{{ t('next') }}</a>{% endif %}
</div>
